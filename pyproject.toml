[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "network_puzzles"
authors = [
    {name = "Tim Young"},
    {name = "Nate Marti", email = "nate_marti@sil.org"},
]
description = "A simple program for teaching network principles"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "kivy",
    "packaging",
]
dynamic = ["readme", "version"]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "ruff",
]
build = [
    # buildozer only works on Linux/macOS (Android builds); skip on Windows.
    "buildozer; sys_platform != 'win32'",
    "pyinstaller",
]


[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".buildozer", "bin", "build", "dist"]
venvPath = "."
venv = ".venv"            # resolve kivy, babel, etc. from the uv venv
typeCheckingMode = "basic"  # "off" | "basic" | "standard" (default) | "strict"

# Turn off individual noisy rules as needed:
reportAttributeAccessIssue = false   # Kivy's dynamic properties and self.ids
reportOptionalMemberAccess = false

[tool.ruff]
builtins = ["_"]

[tool.ruff.format]
# Preserve quote style in code b/c xgettext doesn't recognize `_('text')` strings.
quote-style = "preserve"

[tool.ruff.lint]
# Consider adding later: "N", "RET"
extend-select = ["B", "C4", "SIM", "UP", "PLR1714"]

[tool.ruff.lint.per-file-ignores]
"src/network_puzzles/*" = ["LOG015"]
"__init__.py" = ["E402"]
"pyinstaller*.spec" = ["F821"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/plain"}
version = {attr = "network_puzzles.__version__"}
