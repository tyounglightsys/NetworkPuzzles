name: Build APK file w/ Docker
on:
  workflow_call: # runs in release-drafter.yml
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - ".github/workflows/*apk*"
  #     - "src/network_puzzles/**"
  # push:
  #   branches:
  #     - main

jobs:
  build:
    outputs:
      artifact: ${{ steps.artifact-name.outputs.artifact }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install app python package
        run: pip install .

      # # Cache Buildozer files.  # doesn't seem to speed anything up
      # - name: Cache Buildozer global directory
      #   uses: actions/cache@v4
      #   with:
      #     path: .buildozer_global
      #     key: buildozer-global-${{ hashFiles('buildozer.spec') }} # Replace with your path

      - name: Ensure localization binaries
        run: pip install babel && python ./scripts/compile-locales.py

      - name: Compute Android versionCode
        run: |
          code=$(python scripts/android-version-code.py)
          echo "Android versionCode: $code"
          echo "APP_ANDROID_NUMERIC_VERSION=$code" >> "$GITHUB_ENV"

      - name: Build APK with Buildozer
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -e APP_ANDROID_ACCEPT_SDK_LICENSE=1 \
            -e APP_ANDROID_NUMERIC_VERSION \
            ghcr.io/kivy/buildozer:latest android debug

      - id: artifact-name
        run: echo "artifact=$(basename "$(ls bin/*.apk | head -n1)")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: bin/*.apk
          archive: false
