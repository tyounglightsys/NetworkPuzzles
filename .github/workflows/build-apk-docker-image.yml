name: Build APK file w/ Docker
on:
  workflow_call: # runs in release-drafter.yml
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - ".github/workflows/*apk*"
  #     - "src/network_puzzles/**"
  # push:
  #   branches:
  #     - main

jobs:
  build:
    outputs:
      artifact: ${{ steps.artifact-name.outputs.artifact }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12" # set your python version

      - name: Install app python package
        run: pip install .

      # # Cache Buildozer files.  # doesn't seem to speed anything up
      # - name: Cache Buildozer global directory
      #   uses: actions/cache@v4
      #   with:
      #     path: .buildozer_global
      #     key: buildozer-global-${{ hashFiles('buildozer.spec') }} # Replace with your path

      - name: Ensure localization binaries
        run: pip install babel && python ./scripts/compile-locales.py

      # Build APK
      - name: Build with Buildozer Action
        # uses: ArtemSBulgakov/buildozer-action@v1
        uses: n8marti/buildozer-action@fix-ubuntu-2604
        id: buildozer

      - id: artifact-name
        run: echo "artifact=$(basename ${{ steps.buildozer.outputs.filename }})" >> $GITHUB_OUTPUT

      # Upload artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.buildozer.outputs.filename }}
          archive: false
