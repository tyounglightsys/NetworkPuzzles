name: Run pre-build tests
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "src/network_puzzles/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: |
          uv sync --locked
          uv run ./scripts/compile-locales.py

      - name: CLI tests
        run: uv run ./scripts/test-puzzles.sh 2>/dev/null

      - name: GUI tests
        run: uv run ./scripts/run-tests.sh
